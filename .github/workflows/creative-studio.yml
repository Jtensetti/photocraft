name: Creative Studio
on:
  push:
    branches: [main]
    paths: ["integrations/creative-studio/**", ".github/workflows/creative-studio.yml"]
  pull_request:
    paths: ["integrations/creative-studio/**", ".github/workflows/creative-studio.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: integrations/creative-studio
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: "integrations/creative-studio -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/creative-studio/package-lock.json
      - run: npm ci
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm run build:wasm
      - run: python3 scripts/license-notices.py
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run test:browser
      - run: npm run test:workspace
      - run: npm run test:pro
      - run: npm run test:native
      - run: npm run test:graphics
      - run: npm run test:wasm
      - run: npm run build
      - run: npm run test:production
      - uses: actions/upload-artifact@v4
        with:
          name: creative-studio-web
          path: integrations/creative-studio/dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creative-studio-test-results
          path: integrations/creative-studio/test-results/
